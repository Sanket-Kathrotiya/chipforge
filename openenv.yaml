spec_version: 1
name: chipforge
type: space
runtime: fastapi
app: server.app:app
port: 7860

action_space:
  type: discrete
  fields:
    - name: action_type
      type: string
      values: [view_design, view_testbench, view_synthesis_log, view_lint_log, view_simulation_log, run_simulation, run_synthesis, run_lint, edit_line, append_line, insert_lines, replace_lines, write_file, submit]
      description: "The action to perform on the RTL environment"
    - name: target
      type: string
      values: [design, testbench]
      required: false
      description: "The target file for editing actions"
    - name: line_number
      type: integer
      required: false
      description: "The starting line number for edits"
    - name: end_line_number
      type: integer
      required: false
      description: "The ending line number for replace_lines"
    - name: new_content
      type: string
      required: false
      description: "The new code content to insert or write"
    - name: reasoning
      type: string
      required: false
      description: "Reasoning for the action taken by the LLM"

observation_space:
  fields:
    - name: task_description
      type: string
      description: "Description of the current RTL bug to fix"
    - name: step_count
      type: integer
      description: "Current step number"
    - name: max_steps
      type: integer
      description: "Total steps allowed in the episode"
    - name: error_summary
      type: string
      description: "Summary of errors from the last action"
    - name: last_action
      type: string
      description: "The last action taken"
    - name: action_result
      type: string
      description: "Result of the last action"
    - name: sim_status
      type: string
      description: "Simulation pass/fail status"
    - name: synth_status
      type: string
      description: "Synthesis pass/fail status"
    - name: lint_status
      type: string
      description: "Lint clean/warnings status"
    - name: design_code
      type: string
      description: "Current Verilog design text"
    - name: testbench_code
      type: string
      description: "Current Verilog testbench code text"
    - name: log_output
      type: string
      description: "Log output from the last tool run"

reward:
  min: 0.01
  max: 0.99
  description: >
    Rewards scale based on simulation passes (+0.1 for running, +0.3 for pass),
    synthesis passes (+0.3), and lint passes (+0.2). Step penalties (-0.02) are
    applied. Total normalized strictly into (0, 1).

difficulties:
  - easy
  - medium
  - hard

max_steps: 30

tasks:
  - id: task_easy_missing_semicolon
    difficulty: easy
    grader: chipforge.graders.easy_grader
    description: Fix the missing semicolon in a wire declaration in the full adder RTL.

  - id: task_medium_wrong_operator
    difficulty: medium
    grader: chipforge.graders.medium_grader
    description: Fix the carry-out logic in the full adder. The cout uses the wrong Boolean operator.

  - id: task_medium_counter
    difficulty: medium
    grader: chipforge.graders.medium_grader
    description: Write a Verilog module for a 4-bit synchronous UP/DOWN counter with asynchronous active-high reset. Inputs are 'clk', 'rst', 'enable', 'up_down', and output is a 4-bit register 'count'. When 'rst' is high, the counter resets to 0. When 'enable' is high, it counts up if 'up_down' is 1, and down if 'up_down' is 0. If 'enable' is low, it holds its value. Don't forget to write a self-checking testbench covering reset, count up, count down, and enable low scenarios.

  - id: task_hard_latch_inference
    difficulty: hard
    grader: chipforge.graders.hard_grader
    description: Fix the latch inference warning in the sequential logic.


